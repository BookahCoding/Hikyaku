# Builds and tests every push and pull request. Uses no secrets and publishes nothing.
# Signed releases are published by release.yml, which reads the private key from the Actions secret and does not store it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the secret scan also checks every commit message
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build (warnings are errors)
        run: dotnet build Hikyaku.sln -c Release -nologo

      - name: Core tests
        run: dotnet test tests/Hikyaku.Tests -c Release --no-build -nologo

      - name: WPF tests
        run: dotnet test tests/Hikyaku.App.Tests -c Release --no-build -nologo

      - name: Hermes plugin tests (hikyaku-cron)
        run: python -m unittest discover -s hermes-plugin/hikyaku-cron/tests

      - name: Secret and personal-data scan
        shell: powershell
        run: ./scripts/check-secrets.ps1
