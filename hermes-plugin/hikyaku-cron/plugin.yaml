name: hikyaku-cron
label: Hikyaku cron output
version: 0.1.0
manifest_version: 2
requires_hermes: ">=0.21.5"
description: >
  One read-only command for the Hikyaku Windows client's Inbox: returns a scheduled run's output document
  (cron/output/<job>/<run>.md) so the Inbox can show what a script-only job found, not only the dashboard's
  180-character preview. Checks the job and run names, reads only inside that job's output folder, at most
  512 KB. No tools, no hooks, nothing written.
author: BookahCoding
homepage: https://github.com/BookahCoding/Hikyaku
license: MIT
